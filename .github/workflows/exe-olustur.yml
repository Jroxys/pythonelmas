name: Windows exe olustur

on:
  push:
    branches: [claude/elegant-planck-4vskyy, main]
    paths: ["maas_karsilastir.py", "maas_karsilastir_gui.py", "logo.png", ".github/workflows/exe-olustur.yml"]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install openpyxl pyinstaller pillow
      - name: Derle (logo.png varsa simge ve pencere logosu olarak eklenir)
        shell: pwsh
        run: |
          $secenekler = @("--onefile", "--windowed", "--name", "MaasKarsilastir")
          if (Test-Path logo.png) { $secenekler += @("--icon", "logo.png", "--add-data", "logo.png;.") }
          python -m PyInstaller @secenekler maas_karsilastir_gui.py
      - uses: actions/upload-artifact@v4
        with:
          name: MaasKarsilastir-exe
          path: dist/MaasKarsilastir.exe
