name: Windows exe olustur

on:
  push:
    branches: [claude/elegant-planck-4vskyy, main]
    paths: ["maas_karsilastir.py", ".github/workflows/exe-olustur.yml"]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install openpyxl pyinstaller
      - run: python -m PyInstaller --onefile --name MaasKarsilastir maas_karsilastir.py
      - uses: actions/upload-artifact@v4
        with:
          name: MaasKarsilastir-exe
          path: dist/MaasKarsilastir.exe
